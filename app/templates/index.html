<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="container py-4">
<h2>My Notes</h2>
<div id="auth" class="mb-3">
  <input id="u" class="form-control mb-2" placeholder="username">
  <input id="p" type="password" class="form-control mb-2" placeholder="password">
  <button class="btn btn-primary" onclick="auth('login')">Login</button>
  <button class="btn btn-secondary" onclick="auth('register')">Register</button>
</div>
<div id="app" style="display:none">
  <input id="t" class="form-control mb-2" placeholder="title">
  <textarea id="b" class="form-control mb-2" placeholder="body"></textarea>
  <button class="btn btn-success mb-3" onclick="add()">Add note</button>
  <button class="btn btn-outline-danger mb-3" onclick="out()">Logout</button>
  <ul id="list" class="list-group"></ul>
</div>
<script>
const $ = id => document.getElementById(id);
const api = (m, url, body) => fetch(url, {method: m, headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body)});
async function auth(kind) {
  const r = await api("POST", "/api/" + kind, {username: $("u").value, password: $("p").value});
  if (kind === "login" && r.ok) { $("auth").style.display = "none"; $("app").style.display = ""; load(); }
  else if (kind === "register") alert(r.ok ? "Registered, now login" : "Error");
  else alert("Failed");
}
async function load() {
  const notes = await (await api("GET", "/api/notes")).json();
  $("list").innerHTML = notes.map(n => `<li class="list-group-item d-flex justify-content-between">
    <span><b>${n.title}</b> ${n.body}</span><button class="btn btn-sm btn-danger" onclick="del(${n.id})">x</button></li>`).join("");
}
async function add() { await api("POST", "/api/notes", {title: $("t").value, body: $("b").value}); $("t").value = $("b").value = ""; load(); }
async function del(id) { await api("DELETE", "/api/notes/" + id); load(); }
async function out() { await api("POST", "/api/logout"); location.reload(); }
</script></body></html>
